name = "squeek-wheel"
main = "src/index.ts"
compatibility_date = "2026-10-01"

# Every minute: poll the hamster, update the day's hamster work, send wake/sleep alerts.
# Between 06:00 and 06:30 UTC the same run also posts yesterday's "humans vs hamster" recap.
[triggers]
crons = ["* * * * *"]

[[d1_databases]]
binding = "DB"
database_name = "squeek-wheel"
database_id = "REPLACE_WITH_ID_FROM_wrangler_d1_create"

[vars]
# Public Squeekchain status feed (live wheel telemetry).
STATUS_URL = "https://api.squeekchain.com/v1/status"
# URL of the mini-app (Cloudflare Pages), used by the bot's "Spin" button.
WEBAPP_URL = "https://REPLACE.pages.dev"
# Allowed origin for the API (the Pages domain). "*" while testing.
ALLOWED_ORIGIN = "*"
# Telegram chat/channel id for wake/sleep alerts and the nightly recap. Empty = off.
ALERT_CHAT_ID = ""
# "1" only for local testing: accept requests without Telegram initData.
DEV_ALLOW_UNSIGNED = "0"

# Secrets (set with `npx wrangler secret put <NAME>`, never commit):
#   BOT_TOKEN       - token from @BotFather
#   WEBHOOK_SECRET  - any random string; Telegram sends it back on every webhook call
